name: Preise aktualisieren und Webseite veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Apple-Preise und ZPÜ-Abgaben prüfen
        run: python update_prices.py

      - name: Neue Preisstände und Historie sichern
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "preisfinder-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Preise automatisch aktualisieren" || true
            git push
          else
            echo "Keine Datenänderungen"
          fi

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Webseite als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
